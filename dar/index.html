<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گذاشتن در</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    text-align:center;
}

button{
    font-size:28px;
    padding:18px 40px;
    border:none;
    border-radius:12px;
    background:#007bff;
    color:white;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#0056b3;
}

#message{
    display:none;
    margin-top:30px;
    font-size:32px;
    font-weight:bold;
    color:#0a8d00;
}

footer{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:95%;
    text-align:center;
    font-size:18px;
    color:#555;
    line-height:1.6;
}

/* تنظیمات موبایل */
@media (max-width:600px){

    button{
        width:100%;
        max-width:320px;
        font-size:30px;
        padding:20px;
    }

    #message{
        font-size:30px;
    }

    footer{
        font-size:17px;
        padding:0 10px;
    }
}
</style>
</head>

<body>

<div class="container">
    <button onclick="showMessage()">گذاشتن در</button>

    <div id="message">
        درت با موفقیت گذاشته شد!
    </div>
</div>

<footer>
    توجه: این صفحه به دستور دیکتاتور اعظم نازی ساخته شده است. با تشکر
</footer>

<script>
function showMessage(){
    document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
