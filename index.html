<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>راهنمای دانشکده ریاضی و کامپیوتر خوانسار</title>
<style>
  :root { --bg:#fff; --fg:#1d2433; --muted:#6b7385; --line:#e3e6ee; --panel:#f6f7fb; --accent:#2457d6; --stage:#fffbf2; --sh:0px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161a23; --fg:#e8ebf3; --muted:#98a0b3; --line:#2a3040; --panel:#1d222e; --accent:#6c97ff; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; }
  body { font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); display:flex; height:100vh; overflow:hidden; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  @supports (height:1dvh) { body { height:100dvh; } }
  button { font:inherit; color:inherit; }

  /* ---- فهرست (دسکتاپ: ستون کناری / موبایل: برگه‌ی پایین) ---- */
  #side { width:clamp(280px,26vw,360px); flex:none; display:flex; flex-direction:column; border-inline-end:1px solid var(--line); background:var(--bg); min-height:0; }
  #side header { padding:14px 16px 10px; }
  #side h1 { font-size:16px; margin:0 0 4px; }
  #side p { margin:0; font-size:12px; color:var(--muted); }
  #grip { display:none; }
  #list { flex:1; overflow-y:auto; border-top:1px solid var(--line); overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .grp { padding:8px 16px 4px; font-size:11px; color:var(--muted); background:var(--panel); position:sticky; top:0; z-index:1; }
  .item { display:flex; gap:10px; align-items:center; padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.sel { background:var(--panel); }
  .item.sel { box-shadow:inset -3px 0 0 var(--accent); }
  .item > div:nth-child(2) { min-width:0; }
  .item b { font-size:13px; display:block; font-weight:600; }
  .item small { font-size:12px; color:var(--muted); }
  .dot { flex:none; width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px #222; display:grid; place-items:center; }
  .badge { margin-inline-start:auto; flex:none; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; white-space:nowrap; }

  /* ---- نقشه ---- */
  #main { flex:1; position:relative; min-width:0; background:var(--stage); }
  #bar { position:absolute; z-index:10; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); left:calc(10px + env(safe-area-inset-left)); display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  #sbox { position:relative; flex:1 1 260px; max-width:440px; }
  #q { width:100%; padding:11px 14px; border:1px solid #cfd3de; border-radius:12px; background:#fff; color:#1d2433; font:inherit; font-size:16px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  #res { position:absolute; top:calc(100% + 6px); right:0; left:0; max-height:min(55vh,420px); overflow-y:auto; background:var(--bg); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
  #res .none { padding:14px; font-size:13px; color:var(--muted); }
  #tabs { display:flex; gap:6px; max-width:100%; overflow-x:auto; }
  #tabs button { flex:none; padding:8px 14px; border-radius:999px; border:1px solid #cfd3de; background:#fff; color:#1d2433; font-size:13px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #vp { position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  .stage { position:absolute; left:0; top:0; transform-origin:0 0; display:none; user-select:none; -webkit-user-select:none; }
  .stage.show { display:block; }
  .stage.anim { transition:transform .45s ease; }
  .stage img { display:block; width:100%; height:100%; pointer-events:none; -webkit-user-drag:none; }

  .pin { position:absolute; width:32px; height:32px; padding:0; border-radius:50%; background:var(--c); color:var(--ic); border:2.5px solid #fff; box-shadow:0 0 0 1.5px #222, 0 2px 6px rgba(0,0,0,.45);
         transform:translate(-50%,-50%) scale(var(--inv,1)); display:grid; place-items:center; cursor:pointer; }
  .pin span { display:none; position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:5px; white-space:nowrap; background:#1d2433; color:#fff; font-size:12px; padding:2px 8px; border-radius:6px; pointer-events:none; }
  .stage.zoomed .pin span, .pin.sel span { display:block; }
  .pin.sel { z-index:3; box-shadow:0 0 0 3px var(--accent), 0 0 0 9px rgba(36,87,214,.3); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 3px var(--accent), 0 0 0 14px rgba(36,87,214,0); } }
  @media (pointer:coarse) { .pin { width:38px; height:38px; } }

  #zoom { position:absolute; z-index:5; left:calc(10px + env(safe-area-inset-left)); bottom:calc(var(--sh) + 10px); display:flex; flex-direction:column; gap:6px; transition:bottom .3s ease; }
  #zoom button { width:40px; height:40px; border-radius:10px; border:1px solid #cfd3de; background:#fff; color:#1d2433; font-size:20px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #card { position:absolute; z-index:5; right:calc(10px + env(safe-area-inset-right)); bottom:calc(var(--sh) + 10px); width:min(320px, calc(100% - 76px)); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.2); transition:bottom .3s ease; }
  #card b { font-size:14px; }
  #card small { color:var(--muted); display:block; margin-top:2px; }
  #card p { margin:6px 0 0; font-size:13px; color:var(--muted); }
  #card .go { margin-top:10px; width:100%; padding:10px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  #card .x { position:absolute; left:6px; top:2px; border:0; background:none; font-size:22px; padding:4px 8px; cursor:pointer; color:var(--muted); }
  #toast { position:absolute; top:110px; right:10px; z-index:9; background:#222; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; display:none; direction:ltr; }

  /* ---- موبایل و تبلت کوچک ---- */
  @media (max-width:760px) {
    body { --sh:40vh; }
    @supports (height:1dvh) { body { --sh:40dvh; } }
    body.closed { --sh:calc(56px + env(safe-area-inset-bottom)); }
    #side { position:fixed; z-index:30; inset:auto 0 0 0; width:auto; height:var(--sh); border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.25); transition:height .3s ease; }
    #side header { display:none; }
    #grip { display:flex; align-items:center; gap:10px; flex:none; height:56px; padding:0 16px; border:0; background:none; cursor:pointer; position:relative; }
    #grip::before { content:""; position:absolute; top:7px; left:50%; width:40px; height:4px; margin-left:-20px; border-radius:4px; background:var(--line); }
    #grip b { font-size:14px; margin-top:8px; }
    #grip small { color:var(--muted); margin-top:8px; margin-inline-start:auto; font-size:12px; }
    #list { padding-bottom:env(safe-area-inset-bottom); }
    .item { padding:12px 16px; }
    #sbox { flex-basis:100%; max-width:none; }
  }
  @media (prefers-reduced-motion:reduce) { .pin.sel { animation:none; } .stage.anim, #side, #zoom, #card { transition:none; } }
</style>
</head>
<body>

<aside id="side">
  <button id="grip" aria-expanded="true"><b>فهرست مکان‌ها</b><small id="cnt2"></small></button>
  <header>
    <h1>راهنمای دانشکده ریاضی و کامپیوتر خوانسار</h1>
    <p id="cnt"></p>
  </header>
  <div id="list"></div>
</aside>

<main id="main">
  <div id="vp"></div>
  <div id="bar">
    <div id="sbox"><input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="جستجو در کل دانشکده: بوفه، سلف، نمازخانه…"><div id="res" hidden></div></div>
    <nav id="tabs"></nav>
  </div>
  <div id="zoom"><button id="zi" aria-label="بزرگ‌نمایی">+</button><button id="zo" aria-label="کوچک‌نمایی">−</button><button id="zr" aria-label="بازنشانی" title="بازنشانی">⟲</button></div>
  <div id="card" hidden></div>
  <div id="toast"></div>
</main>

<script>
/* =========================================================
   داده‌ها — x و y درصد موقعیت روی تصویر هستند (۰ تا ۱۰۰).
   مکانِ بدون cat «آزاد» است و بالای فهرست، بدون دسته نمایش داده می‌شود.
   برای گرفتن مختصات: آدرس را با #edit باز کنید و روی نقشه کلیک کنید.
   ========================================================= */
const CATS = { food: "بوفه و سلف", service: "خدمات", dorm: "خوابگاه‌ها", wip: "در حال ساخت" };

const VIEWS = {
  campus: {
    title: "محوطه‌ی دانشکده", short: "محوطه", img: "campus.png",
    places: [
      { name: "ساختمان دانشکده", icon: "school", x: 63.7, y: 49.9, color: "#2cada8", desc: "کلاس‌ها، آموزش، بوفه و سلف غذاخوری", keys: "کلاس آموزش دانشکده ریاضی کامپیوتر", link: "building", area: [48.6, 46.8, 79.0, 53.1] },
      { name: "درب ورودی دانشکده (نگهبانی)", icon: "shield", x: 27.8, y: 81.0, color: "#ed1c24", keys: "در ورودی دانشگاه نگهبانی حراست ورود" },
      { name: "زمین چمن", icon: "park", x: 60.6, y: 18.7, color: "#2fae4b", keys: "ورزش فوتبال زمین ورزشی فضای سبز" },
      { name: "پارکینگ", cat: "service", icon: "parking", x: 47.2, y: 64.4, color: "#2e2e2e", keys: "ماشین خودرو توقف" },
      { name: "سلف جدید", cat: "wip", icon: "restaurant", x: 61.5, y: 38.7, color: "#a82f2f", desc: "در حال ساخت", keys: "غذا ناهار رستوران سلف غذاخوری" },
      { name: "نمازخانه", cat: "wip", icon: "mosque", x: 38.7, y: 31.3, color: "#a87036", desc: "در حال ساخت", keys: "نماز مسجد" },
      { name: "خوابگاه جواهری بانوان", cat: "dorm", icon: "bed", x: 48.1, y: 6.7, color: "#d6429a", keys: "خوابگاه خواهران دختران اقامت" },
      { name: "خوابگاه نیکان آقایان", cat: "dorm", icon: "bed", x: 90.8, y: 33.2, color: "#2b6fb5", keys: "خوابگاه برادران پسران اقامت" }
    ]
  },
  building: {
    title: "داخل ساختمان", short: "داخل ساختمان", img: "building.png",
    places: [
      { name: "بوفه", cat: "food", icon: "cafe", x: 8.0, y: 21.0, color: "#ffa200", keys: "کافه کافی‌شاپ خوراکی نوشیدنی" },
      { name: "سلف غذاخوری", cat: "food", icon: "restaurant", x: 86.2, y: 16.6, color: "#ffe600", keys: "ناهار غذا رستوران" },
      { name: "نمازخانه", cat: "service", icon: "mosque", x: 21.5, y: 42.5, color: "#b0ffb9", keys: "نماز مسجد" },
      { name: "خودپرداز", cat: "service", icon: "atm", x: 55.1, y: 45.2, color: "#ffffff", keys: "عابر بانک ATM پول" },
      { name: "آبسردکن", cat: "service", icon: "water", x: 79.8, y: 24.3, color: "#00e0e0", keys: "آب خنک آب آشامیدنی" },
      { name: "سرویس بهداشتی", cat: "service", icon: "wc", x: 69.6, y: 20.8, color: "#f070ff", keys: "دستشویی توالت wc" }
    ]
  }
};

/* آیکون‌های SVG (۲۴×۲۴) — [مسیر، حالت evenodd] */
const ICONS = {
  restaurant: ["M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"],
  cafe: ["M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.9 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"],
  parking: ["M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"],
  wc: ["M5.5 22v-7.5H4V9c0-1.1.9-2 2-2h3c1.1 0 2 .9 2 2v5.5H9.5V22h-4zM18 22v-6h3l-2.54-7.63C18.18 7.55 17.42 7 16.56 7h-.12c-.86 0-1.63.55-1.9 1.37L12 16h3v6h3zM7.5 6c1.11 0 2-.89 2-2s-.89-2-2-2-2 .89-2 2 .89 2 2 2zm9 0c1.11 0 2-.89 2-2s-.89-2-2-2-2 .89-2 2 .89 2 2 2z"],
  atm: ["M11 17h2v-1h1c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1h-3v-1h4V8h-2V7h-2v1h-1c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h3v1H9v2h2v1zm9-13H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4V6h16v12z"],
  water: ["M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"],
  mosque: ["M12 2c-.4 1.2-1 2-1.7 2.8C8.9 6 7.5 7 7.5 9.2V10H4v10h16V10h-3.5V9.2c0-2.2-1.4-3.2-2.8-4.4C13 4 12.4 3.2 12 2zM10 20v-3.5a2 2 0 0 1 4 0V20h-4z", 1],
  bed: ["M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"],
  school: ["M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"],
  shield: ["M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"],
  park: ["M17 12h2L12 2 5.05 12H7l-3.9 6h6.92v4h3.96v-4H21l-4-6z"],
  pin: ["M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"]
};
const svg = (n, sz) => { const [d, eo] = ICONS[n] || ICONS.pin; return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="currentColor"${eo ? ' fill-rule="evenodd"' : ""} aria-hidden="true"><path d="${d}"/></svg>`; };
const ink = c => { const m = /^#([0-9a-f]{6})$/i.exec(c); if (!m) return "#fff"; const n = parseInt(m[1], 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150 ? "#1d2433" : "#fff"; };
const dot = p => `<div class="dot" style="background:${p.color};color:${ink(p.color)}">${svg(p.icon, 16)}</div>`;

/* =========================================================
   کد صفحه
   ========================================================= */
const $ = id => document.getElementById(id);
const vp = $("vp"), card = $("card"), listEl = $("list"), qEl = $("q"), toastEl = $("toast");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mobile = () => matchMedia("(max-width:760px)").matches;
const st = {};
let cur = "campus", sel = null, dragged = false;

function build() {
  for (const [key, v] of Object.entries(VIEWS)) {
    const tab = document.createElement("button");
    tab.textContent = v.title; tab.dataset.k = key; tab.onclick = () => show(key);
    $("tabs").appendChild(tab);

    const el = document.createElement("div"); el.className = "stage";
    const im = new Image(); im.src = v.img; im.alt = v.title; im.draggable = false; el.appendChild(im);
    v.places.forEach((p, i) => {
      p.id = key + i;
      const b = document.createElement("button");
      b.className = "pin"; b.dataset.id = p.id; b.setAttribute("aria-label", p.name);
      b.style.left = p.x + "%"; b.style.top = p.y + "%"; b.style.setProperty("--c", p.color); b.style.setProperty("--ic", ink(p.color));
      b.innerHTML = svg(p.icon, 18) + `<span>${esc(p.name)}</span>`;
      b.onclick = () => { if (!dragged) select(key, p); };
      el.appendChild(b);
    });
    vp.appendChild(el);
    st[key] = { el, s: 1, s0: 1, tx: 0, ty: 0, iw: 0, ih: 0, fitted: false };
    const ready = () => {
      Object.assign(st[key], { iw: im.naturalWidth, ih: im.naturalHeight });
      el.style.width = im.naturalWidth + "px"; el.style.height = im.naturalHeight + "px";
      if (key === cur) fit();
    };
    im.complete && im.naturalWidth ? ready() : (im.onload = ready);
  }
}

function apply() {
  const o = st[cur];
  o.el.style.transform = `translate(${o.tx}px,${o.ty}px) scale(${o.s})`;
  o.el.style.setProperty("--inv", 1 / o.s);
  o.el.classList.toggle("zoomed", o.s >= o.s0 * 2.2);
}
function fit(keep) {
  const o = st[cur]; if (!o || !o.iw) return;
  /* نقشه در فضای خالی بین نوار جستجو و برگه‌ی پایین جا می‌شود */
  const top = $("bar").offsetHeight + 16, bot = mobile() ? $("side").offsetHeight : 0;
  const w = vp.clientWidth, h = Math.max(120, vp.clientHeight - top - bot), s0 = Math.min(w / o.iw, h / o.ih) * 0.96;
  const atFit = !o.fitted || Math.abs(o.s - o.s0) < 1e-6;
  o.s0 = s0;
  if (!keep || atFit) { o.s = s0; o.tx = (w - o.iw * s0) / 2; o.ty = top + (h - o.ih * s0) / 2; }
  o.fitted = true; apply();
}
function zoomAt(f, px, py) {
  const o = st[cur];
  const ns = Math.min(o.s0 * 8, Math.max(o.s0 * 0.8, o.s * f));
  o.tx = px - (px - o.tx) * ns / o.s; o.ty = py - (py - o.ty) * ns / o.s; o.s = ns; apply();
  if (f > 1) autoEnter();
}
/* وقتی کاربر آن‌قدر روی ساختمان زوم کند که ساختمان تقریباً کل صفحه را بگیرد، نقشه‌ی داخلی باز می‌شود */
function autoEnter() {
  const o = st[cur];
  for (const p of VIEWS[cur].places) {
    if (!p.area || !p.link) continue;
    const [x1, y1, x2, y2] = p.area;
    const cx = (vp.clientWidth / 2 - o.tx) / o.s / o.iw * 100, cy = (vp.clientHeight / 2 - o.ty) / o.s / o.ih * 100;
    if (cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2 && (x2 - x1) / 100 * o.iw * o.s >= vp.clientWidth * 0.9) {
      st[p.link].fitted = false; show(p.link);
      vp.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 350 }); return;
    }
  }
}
function focusOn(p) {
  const o = st[cur];
  o.s = Math.max(o.s, o.s0 * 2.4);
  o.tx = vp.clientWidth / 2 - p.x / 100 * o.iw * o.s;
  o.ty = vp.clientHeight * 0.42 - p.y / 100 * o.ih * o.s;
  o.el.classList.add("anim"); apply();
  setTimeout(() => o.el.classList.remove("anim"), 500);
}

function show(key) {
  cur = key; sel = null; card.hidden = true;
  for (const [k, o] of Object.entries(st)) o.el.classList.toggle("show", k === key);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === key));
  document.querySelectorAll(".pin.sel, #list .item.sel").forEach(e => e.classList.remove("sel"));
  fit(true);
}

function select(key, p) {
  if (key !== cur) show(key);
  sel = p;
  document.querySelectorAll(".pin").forEach(b => b.classList.toggle("sel", b.dataset.id === p.id));
  document.querySelectorAll("#list .item").forEach(i => { const on = i.dataset.id === p.id; i.classList.toggle("sel", on); if (on && !mobile()) i.scrollIntoView({ block: "nearest" }); });
  card.hidden = false;
  card.innerHTML = `<button class="x" aria-label="بستن">×</button><b>${esc(p.name)}</b>
    <small>${p.cat ? esc(CATS[p.cat]) + " · " : ""}${esc(VIEWS[key].short)}</small>
    ${p.desc ? `<p>${esc(p.desc)}</p>` : ""}${p.link ? `<button class="go">مشاهده‌ی نقشه‌ی داخلی ←</button>` : ""}`;
  card.querySelector(".x").onclick = () => { card.hidden = true; };
  const go = card.querySelector(".go"); if (go) go.onclick = () => show(p.link);
  if (mobile()) setSheet(false);
  focusOn(p);
}

/* ---- فهرست سراسری: همه‌ی مکان‌ها از همه‌ی نقشه‌ها ---- */
function renderList() {
  const all = [];
  for (const [key, v] of Object.entries(VIEWS)) v.places.forEach(p => all.push({ key, v, p }));
  $("cnt").textContent = all.length + " مکان در " + Object.keys(VIEWS).length + " نقشه — برای دیدن روی نقشه، یکی را انتخاب کنید.";
  $("cnt2").textContent = all.length + " مکان";
  listEl.innerHTML = "";
  const addItems = items => items.forEach(({ key, v, p }) => {
    const it = document.createElement("div"); it.className = "item"; it.dataset.id = p.id;
    it.innerHTML = `${dot(p)}<div><b>${esc(p.name)}</b>${p.desc ? `<small>${esc(p.desc)}</small>` : ""}</div><span class="badge">${esc(v.short)}</span>`;
    it.onclick = () => select(key, p); listEl.appendChild(it);
  });
  addItems(all.filter(x => !x.p.cat));
  for (const [c, label] of Object.entries(CATS)) {
    const items = all.filter(x => x.p.cat === c); if (!items.length) continue;
    const g = document.createElement("div"); g.className = "grp"; g.textContent = label; listEl.appendChild(g); addItems(items);
  }
}

/* ---- برگه‌ی پایین در موبایل ---- */
function setSheet(open) { document.body.classList.toggle("closed", !open); $("grip").setAttribute("aria-expanded", open); }
$("grip").onclick = () => setSheet(document.body.classList.contains("closed"));

/* ---- جستجوی سراسری: نام، توضیح، دسته، کلمات کلیدی و نام نقشه ---- */
const norm = s => String(s || "").toLowerCase().replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[أإآٱ]/g, "ا")
  .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
  .replace(/[\u064B-\u065F\u0640\u200c\u200d\s]/g, "");
function runSearch() {
  const q = norm(qEl.value), res = $("res");
  if (!q) { res.hidden = true; return []; }
  const hits = [];
  for (const [key, v] of Object.entries(VIEWS)) for (const p of v.places) {
    const n = norm(p.name);
    if ((n + norm(CATS[p.cat]) + norm(p.desc) + norm(p.keys) + norm(v.title)).includes(q)) hits.push({ key, p, v, r: n.startsWith(q) ? 0 : n.includes(q) ? 1 : 2 });
  }
  hits.sort((a, b) => a.r - b.r);
  res.hidden = false; res.innerHTML = "";
  if (!hits.length) { res.innerHTML = '<div class="none">موردی پیدا نشد. عبارت دیگری امتحان کنید.</div>'; return hits; }
  hits.forEach(h => {
    const it = document.createElement("div"); it.className = "item";
    it.innerHTML = `${dot(h.p)}<div><b>${esc(h.p.name)}</b><small>${esc(CATS[h.p.cat] || "")}</small></div><span class="badge">${esc(h.v.title)}</span>`;
    it.onclick = () => { res.hidden = true; qEl.blur(); select(h.key, h.p); };
    res.appendChild(it);
  });
  return hits;
}
qEl.addEventListener("input", runSearch);
qEl.addEventListener("focus", runSearch);
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { const h = runSearch(); if (h[0]) { $("res").hidden = true; qEl.blur(); select(h[0].key, h[0].p); } }
  if (e.key === "Escape") $("res").hidden = true;
});
document.addEventListener("pointerdown", e => { if (!e.target.closest("#sbox")) $("res").hidden = true; });

/* ---- جابه‌جایی و زوم (ماوس و لمس) ---- */
const ptrs = new Map(); let sx0 = 0, sy0 = 0;
vp.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); sx0 = e.clientX; sy0 = e.clientY; dragged = false; });
vp.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const o = st[cur], prev = ptrs.get(e.pointerId);
  if (ptrs.size === 1) {
    if (!dragged && Math.hypot(e.clientX - sx0, e.clientY - sy0) < 6) return;
    if (!dragged) vp.setPointerCapture(e.pointerId);
    dragged = true; o.tx += e.clientX - prev[0]; o.ty += e.clientY - prev[1];
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); apply();
  } else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev[0] - other[0], prev[1] - other[1]);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const d1 = Math.hypot(e.clientX - other[0], e.clientY - other[1]), r = vp.getBoundingClientRect(); dragged = true;
    if (d0) zoomAt(d1 / d0, (e.clientX + other[0]) / 2 - r.left, (e.clientY + other[1]) / 2 - r.top);
  }
});
const up = e => { ptrs.delete(e.pointerId); setTimeout(() => { dragged = false; }, 0); };
vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
vp.addEventListener("wheel", e => {
  e.preventDefault(); const r = vp.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$("zi").onclick = () => zoomAt(1.4, vp.clientWidth / 2, vp.clientHeight / 2);
$("zo").onclick = () => zoomAt(1 / 1.4, vp.clientWidth / 2, vp.clientHeight / 2);
$("zr").onclick = () => fit();
window.addEventListener("resize", () => fit(true));

/* ---- ابزار گرفتن مختصات: آدرس را با #edit باز کنید ---- */
if (location.hash === "#edit") {
  vp.addEventListener("click", e => {
    if (dragged) return;
    const r = st[cur].el.getBoundingClientRect();
    const t = `x: ${((e.clientX - r.left) / r.width * 100).toFixed(1)}, y: ${((e.clientY - r.top) / r.height * 100).toFixed(1)}`;
    navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {});
    toastEl.textContent = t; toastEl.style.display = "block"; setTimeout(() => { toastEl.style.display = "none"; }, 2500);
  });
}

build(); renderList(); show("campus");
</script>
</body>
